<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#05070b"><title>Player 24/7</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="screen" aria-label="Player 24/7">
    <section id="buffer-a" class="buffer active"></section><section id="buffer-b" class="buffer"></section>
    <div id="empty" class="empty"><div class="brand">PLAYER <b>24/7</b></div><p>Conectando ao conteúdo…</p><span id="pair-code"></span></div>
    <button id="secret-hit" aria-label="Abrir configuração"></button>
    <aside id="channel-drawer" class="drawer"><header><strong>Canais M3U</strong><button id="close-channels">×</button></header><div id="channel-list"></div></aside>
    <div id="ticker" class="ticker hidden"><span id="clock"></span><span id="weather"></span><span id="dollar"></span><span id="headlines"></span></div>
    <div id="toast" class="toast"></div>
  </main>
  <dialog id="settings-dialog"><form method="dialog" id="settings-form"><h2>Configuração do player</h2><p class="muted">Menu técnico: toque 5 vezes no canto superior esquerdo.</p><label>URL do Supabase<input id="sb-url" type="url" placeholder="https://projeto.supabase.co"></label><label>Anon Key<input id="sb-key" type="password" placeholder="eyJ..."></label><label>URL da playlist M3U<input id="m3u-url" type="url" placeholder="https://.../playlist.m3u"></label><label class="row"><input id="demo-mode" type="checkbox"> Usar conteúdo demonstrativo</label><footer><button value="cancel">Cancelar</button><button id="save-settings" value="default" class="primary">Salvar e sincronizar</button></footer></form></dialog>
  <script src="app.js"></script>
</body>
</html>
